<body><main id="app" class="app"><div class="loading">正在连接 Anki…</div></main>
<script>
const root = document.getElementById("app");
const state = {
  view: "overview",
  init: null,
  dashboard: null,
  queue: "review",
  filter: "all",
  sort: "recent",
  selected: null,
  detail: null,
  editing: false,
  draft: null,
  message: "",
  collapsed: readCollapsed(),
  answerOpen: false,
  confirmedDelete: null,
  busy: false,
  settingsBusy: false,
  preparingDelete: false,
};
const pending = new Map();
let requestSeq = 0;
let generation = 0;
let detailRequestSeq = 0;
let pendingAction = null;
let pendingSettings = null;
let layoutFrame = 0;
let contentObservers = [];
let cardFrameResizers = [];

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, function (char) {
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[char];
  });
}

function readCollapsed() {
  try {
    return localStorage.getItem("attention.listCollapsed") === "1";
  } catch (_) {
    return false;
  }
}

function send(command, params, requestGeneration) {
  params = params || {};
  requestGeneration = requestGeneration ?? generation;
  return new Promise(function (resolve, reject) {
    const requestId = String(++requestSeq);
    pending.set(requestId, {resolve: resolve, reject: reject, generation: requestGeneration});
    try {
      pycmd("attention:" + JSON.stringify({
        command: command,
        requestId: requestId,
        generation: requestGeneration,
        params: params,
      }));
    } catch (error) {
      pending.delete(requestId);
      reject(error);
    }
  });
}

window.__attentionResponse = function (message) {
  const item = pending.get(message.requestId);
  if (!item) return;
  pending.delete(message.requestId);
  if (message.generation !== item.generation) {
    item.reject(new Error("请求已失效"));
    return;
  }
  if (message.error) {
    const error = new Error(message.error.message);
    error.code = message.error.code;
    item.reject(error);
  } else {
    item.resolve(message.result);
  }
};

function bridgeReady(callback, attempts) {
  attempts = attempts || 0;
  if (typeof pycmd !== "undefined") {
    callback();
  } else if (attempts < 200) {
    setTimeout(function () { bridgeReady(callback, attempts + 1); }, 50);
  } else {
    showFatal("Anki bridge 未就绪，请重启 Anki。");
  }
}

async function initialize() {
  try {
    state.init = await send("initialize");
    render();
    if (!state.init.selectionRequired) await loadDashboard();
  } catch (error) {
    showFatal(error.message);
  }
}

function showFatal(message) {
  root.innerHTML = '<div class="error">' + esc(message) + "</div>";
}

function allRows() {
  if (!state.dashboard) return [];
  return state.queue === "optimization"
    ? state.dashboard.optimization_queue
    : state.dashboard.review_queue;
}

function currentRows() {
  let rows = allRows();
  if (state.queue === 'review') {
    if (state.filter === "slow") rows = rows.filter(function (row) { return row.slow_count >= 2; });
    if (state.filter === "again") rows = rows.filter(function (row) { return row.again_count >= 3 || (row.again_count >= 2 && row.again_day_count >= 2); });
    if (state.filter === "quality") rows = rows.filter(function (row) { return row.problems.length > 0; });
  }
  const score = row => state.sort === "slow" ? row.slow_count :
    state.sort === "again" ? row.again_count : row.total_min_30;
  return rows.slice().sort((a, b) => score(b) - score(a) || b.slow_count - a.slow_count ||
    b.total_min_30 - a.total_min_30 || a.cardId - b.cardId);
}

async function loadDashboard(options) {
  options = options || {};
  if (!state.init || state.init.selectionRequired) return false;
  if (state.editing && !options.afterSave) {
    requestChange(function () { loadDashboard(options); });
    return;
  }
  const requestGeneration = ++generation;
  const preferredCardId = options.preferredCardId ?? state.selected;
  const fallbackCardId = options.fallbackCardId ?? null;
  detailRequestSeq += 1;
  state.busy = true;
  render();
  try {
    const data = await send("loadDashboard", {
      deckId: state.init.selectedDeckId,
      dailyBudgetMinutes: state.init.dailyBudgetMinutes,
    }, requestGeneration);
    if (requestGeneration !== generation) return;
    state.dashboard = data;
    const rows = currentRows();
    if (rows.some(function (row) { return row.cardId === preferredCardId; })) {
      state.selected = preferredCardId;
    } else if (rows.some(function (row) { return row.cardId === fallbackCardId; })) {
      state.selected = fallbackCardId;
    } else {
      state.selected = rows[0] ? rows[0].cardId : null;
    }
    state.detail = null;
    state.busy = false;
    render();
    if (state.view === "cards" && state.selected !== null) {
      await loadCard(state.selected, {force: true});
    }
    applyPendingSettings();
    return true;
  } catch (error) {
    if (requestGeneration !== generation) return;
    state.busy = false;
    state.message = "刷新失败：" + error.message;
    render();
    return false;
  }
}

async function loadCard(cardId, options) {
  options = options || {};
  if (state.editing) {
    requestChange(function () { loadCard(cardId); });
    return;
  }
  const sequence = ++detailRequestSeq;
  const requestGeneration = generation;
  if (state.selected !== cardId) state.answerOpen = false;
  state.selected = cardId;
  state.detail = null;
  render();
  try {
    const detail = await send("loadCard", {cardId: cardId}, requestGeneration);
    if (sequence !== detailRequestSeq || requestGeneration !== generation || state.selected !== cardId) return;
    state.detail = detail;
    render();
    if (options.reveal) {
      const card = root.querySelector('.detail');
      card?.classList.add('card-enter');
      if (card && card.getBoundingClientRect().top < 80) card.scrollIntoView({block: 'start'});
      queueLayout();
    }
  } catch (error) {
    if (sequence !== detailRequestSeq || requestGeneration !== generation || state.selected !== cardId) return;
    state.message = "卡片读取失败：" + error.message;
    render();
  }
}

function header() {
  return '<header class="app-header">' +
    '<div class="wordmark"><span class="mark">A</span><span class="brand">Attention Is All You Need</span></div>' +
    '<nav class="header-nav">' +
    '<button data-view="overview" class="' + (state.view === "overview" ? "active" : "") + '">总览</button>' +
    '<button data-view="cards" class="' + (state.view === "cards" ? "active" : "") + '">卡片检查</button>' +
    "</nav></header>";
}

function scope() {
  const init = state.init;
  const refs = init ? init.deckRefs : [];
  const disabled = state.settingsBusy || state.busy || state.preparingDelete ? "disabled" : "";
  return '<section class="scope-row"><div><div class="kicker">ATTENTION BUDGET</div><h1>' +
    (state.view === "overview" ? "注意力看板" : "一次完成一个取舍") +
    '</h1></div><div class="settings"><label>牌组<select id="scope" ' + disabled + ">" +
    (init.selectionRequired ? '<option value="" selected>请选择牌组</option>' : "") +
    refs.map(function (ref) {
      return '<option value="' + ref.deckId + '" ' + (ref.deckId === init.selectedDeckId ? "selected" : "") + ">" +
        esc(ref.name) + (ref.descendantCount ? "（含 " + ref.descendantCount + " 个子牌组）" : "") + "</option>";
    }).join("") +
    '</select></label><label>每日预算<input id="budget" type="number" min="1" max="1440" value="' +
    esc(init.dailyBudgetMinutes || 30) + '" ' + disabled + '> 分钟</label>' +
    '<button class="btn quiet" id="refresh" ' + disabled + ">刷新</button></div></section>";
}

function overview() {
  const data = state.dashboard;
  if (!data) return state.busy ? '<div class="loading">正在计算真实 Anki 数据…</div>' : '<div class="empty">暂无数据</div>';
  const capacity = data.capacity;
  const rows = data.review_queue.slice(0, 6);
  return '<section class="briefing"><div class="budget-ticket"><div class="kicker">未来 7 天 · ' +
    esc(data.selected_deck) + '</div><small>' + esc(capacity.periodStart || '') + ' — ' +
    esc(capacity.periodEnd || '') + '</small><div class="big-amount"><b>' + capacity.forecast_minutes +
    '</b><span>/ ' + capacity.weekly_budget_minutes + ' 分钟</span></div><div class="ticket-bottom">' +
    '<div><small>预算余量</small><strong>' + capacity.headroom_minutes + ' 分钟</strong></div>' +
    '<div><small>有效复习日</small><strong>' + capacity.active_days + ' 天</strong></div></div></div>' +
    '<div class="recommendation"><div class="kicker">' + (capacity.simulator_ready ? "FSRS 模拟" : "排程估算") +
    '</div><h2>' + esc(capacity.decision) + '</h2><p>' + esc(capacity.decision_basis) + " " +
    esc(capacity.forecast_note) + '</p><button class="btn primary" data-open-cards>检查候选 <span>→</span></button>' +
    '</div></section><div class="today-line"><span>' + esc(data.conclusion) + '</span><span>今日 ' +
    data.today.reviews + " 次 · " + data.today.minutes + " 分钟 · 首次学习 " + data.balance.new_today +
    ' 张</span></div><div class="section-head"><h2>先看这些卡片</h2><small>候选 ' +
    data.candidate_counts.reviewTotal + " 张 · 此处显示 " + rows.length + " 张</small></div>" +
    (rows.length ? '<section class="card-grid">' + rows.map(tile).join("") + "</section>" :
      '<div class="empty">当前范围没有值得检查候选</div>');
}

function tile(row) {
  return '<button class="candidate" data-card="' + row.cardId + '">' +
    coverArt(row, 'tile-art') +
    '<div class="tile-body"><h3>' + esc(row.summary) + '</h3><div class="reason">' +
    esc(row.reasons.join(" · ")) + '</div><div class="tile-meta"><strong>' + row.total_min_30 +
    " 分钟</strong><small>近 30 天</small></div></div></button>";
}

function thumbnailSrc(row) {
  if (!row.thumbnail) return "";
  return /^(https?:|data:|\/)/.test(row.thumbnail) ? row.thumbnail : "/" + row.thumbnail;
}

function stackCover(className) {
  return '<div class="' + className + ' fallback-cover" aria-hidden="true"><span class="stack-symbol">' +
    '<i></i><i></i><i></i></span></div>';
}

function coverArt(row, className) {
  const src = thumbnailSrc(row);
  if (src) return '<div class="' + className + '"><img src="' + esc(src) + '" alt=""></div>';
  if (row.previewKind === 'text' && row.previewText) {
    return '<div class="' + className + ' text-preview"><div class="text-cover"><strong>' +
      esc(row.previewText) + '</strong><small>' + esc(row.deck || row.titleFallback || '') + '</small></div></div>';
  }
  return stackCover(className);
}

function detailCover(row) {
  return coverArt(row, 'detail-cover tile-art');
}

function detailFallbackTitle(row) {
  return row.previewKind === 'fallback' && row.titleFallback ?
    '<h2 class="detail-fallback-title">' + esc(row.titleFallback) + '</h2>' : '';
}

function queueButtons() {
  const counts = state.dashboard ? state.dashboard.candidate_counts : {reviewTotal: 0, optimizationTotal: 0};
  return '<button data-queue="review" class="' + (state.queue === "review" ? "active" : "") +
    '">值得检查 ' + counts.reviewTotal + '</button><button data-queue="optimization" class="' +
    (state.queue === "optimization" ? "active" : "") + '">待优化 ' + counts.optimizationTotal + "</button>";
}

function filterButtons() {
  if (state.queue !== 'review') return '<small>按需优化卡片标签显示，包含暂停或忽略的卡片</small>';
  return [["all", "全部"], ["slow", "多次慢"], ["again", "多次 Again"], ["quality", "结构疑点"]]
    .map(function (item) {
      return '<button data-filter="' + item[0] + '" class="' + (state.filter === item[0] ? "active" : "") +
        '">' + item[1] + "</button>";
    }).join("");
}

function inspection() {
  const rows = currentRows();
  const total = allRows().length;
  let body;
  if (!rows.length) {
    body = '<div class="empty">当前筛选没有卡片</div>';
  } else {
    const selectedRow = rows.find(function (row) { return row.cardId === state.selected; }) || rows[0];
    if (state.selected !== selectedRow.cardId) state.selected = selectedRow.cardId;
    const list = '<aside id="inspection-list" class="inspection-list" ' + (state.collapsed ? 'hidden' : '') + '>' + rows.map(function (row) {
      const evidence = row.reasons.concat(row.limitations || []);
      return '<button class="mini-card ' + (row.cardId === selectedRow.cardId ? "selected" : "") +
        '" data-card="' + row.cardId + '" ' + (state.editing ? "disabled" : "") + '><h3>' +
        esc(row.summary) + '</h3><div class="mini-meta">' + esc(evidence.join(" · ")) + "</div></button>";
    }).join("") + "</aside>";
    body = '<section class="inspection ' + (state.collapsed ? "collapsed" : "") + '">' + list +
      '<div class="workspace"><button class="list-toggle" id="collapse" aria-controls="inspection-list" aria-expanded="' + !state.collapsed + '" aria-label="' +
      (state.collapsed ? "展开列表" : "收起列表") + '">' + icon(state.collapsed ? 'sidebar' : 'left') + "</button>" +
      detailArea(selectedRow, rows) + "</div></section>" + dialogs();
  }
  return '<div class="inspection-heading"><div class="filter-group">' + queueButtons() +
    '</div><div class="signal-options">' + filterButtons() + '</div><label class="sort-label">排序<select id="sort">' +
    [['recent', '近 30 天耗时'], ['slow', '慢次数'], ['again', 'Again 次数']].map(([key, label]) =>
      '<option value="' + key + '" ' + (state.sort === key ? 'selected' : '') + '>' + label + '</option>').join('') +
    '</select></label><span class="filter-count">候选 ' + total + ' 张 · 筛选 ' + rows.length + ' 张 · 显示 ' + rows.length + " 张</span></div>" +
    (state.message ? '<div class="message">' + esc(state.message) + "</div>" : "") + body;
}

function cardFrame(content, title, css) {
  const documentHtml = '<!doctype html><html><head><base href="' + location.origin +
    '/" target="_blank"><style>html,body{margin:0;padding:0;background:transparent}img{max-width:100%;height:auto}' + (css || "") +
    '</style></head><body class="card"><div data-card-content style="display:flow-root">' + content + "</div></body></html>";
  return '<iframe class="rendered-card" title="' + esc(title) +
    '" sandbox="allow-same-origin allow-popups" srcdoc="' +
    esc(documentHtml) + '"></iframe>';
}

function formatReviewEvents(events) {
  if (!events || !events.length) return "暂无有效复习记录";
  return events.slice().reverse().map(function (event) {
    const date = new Date(event.reviewedAt * 1000);
    const day = date.getFullYear() + "-" + String(date.getMonth() + 1).padStart(2, "0") + "-" +
      String(date.getDate()).padStart(2, "0");
    return day + " · " + Math.round(event.durationMs / 1000) + " 秒" + (event.rating === 1 ? " · Again" : "");
  }).join("<br>");
}

function icon(name) {
  const paths = {
    left: 'M15 5l-7 7 7 7', sidebar: 'M5 5v14M11 6l6 6-6 6',
    pause: 'M8 5v14M16 5v14', play: 'M8 5l11 7-11 7z',
    optimize: 'M15 5l4 4M4 20l4-1L19 8l-3-3L5 16zM5 4v4M3 6h4',
    hide: 'M3 3l18 18M10 10a3 3 0 0 0 4 4M6 6C4 8 2 12 2 12s4 7 10 7c2 0 4-1 6-3M10 5c7-1 12 7 12 7s-1 2-3 4',
    tag: 'M3 3h8l10 10-8 8L3 11zM7 7h.01', trash: 'M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7M14 10v7',
  };
  return '<svg class="action-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + paths[name] + '"></path></svg>';
}

function queueLayout() {
  if (layoutFrame) return;
  layoutFrame = requestAnimationFrame(() => { layoutFrame = 0; positionReadingControls(); });
}

function positionReadingControls() {
  const card = root.querySelector('.detail');
  if (!card) return;
  const rect = card.getBoundingClientRect();
  const top = Math.max(80, rect.top), bottom = Math.min(innerHeight - 12, rect.bottom);
  const visible = bottom - top >= 80 && rect.right > 12 && rect.left < innerWidth - 12;
  const center = (top + bottom) / 2;
  root.querySelectorAll('[data-step]').forEach(button => {
    button.hidden = !visible || state.editing;
    const x = button.dataset.step === '-1' ? rect.left - 46 : rect.right + 4;
    button.style.left = Math.max(4, Math.min(x, innerWidth - 46)) + 'px';
    button.style.top = (center - 21) + 'px';
  });
  const toggle = root.querySelector('#collapse'), list = root.querySelector('.inspection-list');
  if (!toggle || !list) return;
  const listRect = list.getBoundingClientRect();
  const low = Math.max(80, listRect.top) + 28, high = Math.min(innerHeight - 12, listRect.bottom) - 28;
  let y = (low + high) / 2;
  if (Math.abs(y - center) < 66) {
    y = [center - 66, center + 66].filter(n => n >= low && n <= high)[0] ?? low;
  }
  const floating = !state.collapsed && innerWidth > 760 && high - low >= 104 && Math.abs(y - center) >= 52;
  toggle.classList.toggle('is-handle', floating);
  toggle.style.left = floating ? ((listRect.right + rect.left) / 2 - 11) + 'px' : '';
  toggle.style.top = floating ? (y - 28) + 'px' : '';
}

function bindCardFrames() {
  root.querySelectorAll('.rendered-card').forEach(frame => {
    frame.addEventListener('load', () => {
      if (!frame.isConnected) return;
      const doc = frame.contentDocument;
      if (!doc?.body) return;
      const content = doc.querySelector('[data-card-content]');
      let resizeFrame = 0;
      const resize = () => {
        if (!frame.isConnected || !frame.getBoundingClientRect().width) return;
        if (resizeFrame) cancelAnimationFrame(resizeFrame);
        resizeFrame = requestAnimationFrame(() => {
          resizeFrame = 0;
          if (!frame.isConnected) return;
          // Measure against a fixed viewport so vh-based templates cannot grow
          // the iframe that defines their own viewport on every observation.
          frame.style.height = '150px';
          const height = Math.ceil(Math.max(
            content.scrollHeight,
            doc.body.scrollHeight,
            doc.documentElement.scrollHeight,
          ));
          frame.style.height = Math.max(150, height) + 'px';
          queueLayout();
        });
      };
      doc.querySelectorAll('a[href]').forEach(link => {
        // Explicit targets in imported HTML must not navigate the card or manager.
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
      });
      doc.querySelectorAll('img').forEach(img => {
        img.addEventListener('load', resize);
        img.addEventListener('error', () => { img.alt = '图片不可用：' + img.getAttribute('src'); resize(); });
      });
      const observer = new MutationObserver(resize);
      observer.observe(content, {subtree: true, childList: true, characterData: true, attributes: true});
      contentObservers.push(observer);
      cardFrameResizers.push(resize);
      doc.fonts?.ready.then(resize);
      frame.closest('.answer')?.addEventListener('toggle', resize);
      resize();
    });
  });
}

function closeProcessMenu(focus = false) {
  const menu = root.querySelector('[data-process-menu]');
  if (!menu?.open) return;
  menu.open = false;
  menu.querySelector('summary').setAttribute('aria-expanded', 'false');
  if (focus) menu.querySelector('summary').focus({preventScroll: true});
}

function positionMenu(menu) {
  const popup = menu.querySelector('.process-popover');
  const rect = menu.querySelector('summary').getBoundingClientRect();
  popup.style.left = Math.max(12, Math.min(rect.left, innerWidth - popup.offsetWidth - 12)) + 'px';
  const below = rect.bottom + 8;
  popup.style.top = (below + popup.offsetHeight <= innerHeight - 12 ? below : Math.max(12, rect.top - popup.offsetHeight - 8)) + 'px';
}

function bindProcessMenu() {
  const menu = root.querySelector('[data-process-menu]');
  if (!menu) return;
  const trigger = menu.querySelector('summary');
  const open = last => {
    if (state.busy || state.preparingDelete) return;
    menu.open = true;
    trigger.setAttribute('aria-expanded', 'true');
    positionMenu(menu);
    const items = menu.querySelectorAll('[role="menuitem"]');
    items[last ? items.length - 1 : 0]?.focus({preventScroll: true});
  };
  trigger.addEventListener('click', event => {
    event.preventDefault();
    if (menu.open) closeProcessMenu(true); else open(false);
  });
  trigger.addEventListener('keydown', event => {
    if (!['ArrowDown', 'ArrowUp'].includes(event.key)) return;
    event.preventDefault(); event.stopPropagation(); open(event.key === 'ArrowUp');
  });
  menu.addEventListener('toggle', () => { if (menu.open) positionMenu(menu); });
  menu.addEventListener('keydown', event => {
    if (event.key === 'Escape' || event.key === 'Tab') {
      event.stopPropagation();
      if (event.key === 'Escape') event.preventDefault();
      closeProcessMenu(true); return;
    }
    const items = [...menu.querySelectorAll('[role="menuitem"]')];
    const index = items.indexOf(document.activeElement);
    const positions = {ArrowDown: (index + 1) % items.length, ArrowUp: (index - 1 + items.length) % items.length,
      Home: 0, End: items.length - 1};
    if (event.key in positions) { event.preventDefault(); event.stopPropagation(); items[positions[event.key]].focus(); }
  });
}

function detailArea(row, rows) {
  const detail = state.detail;
  if (!detail || detail.cardId !== row.cardId) {
    return '<div class="detail-shell"><div></div><article class="detail"><div class="loading">正在读取完整卡片…</div></article><div></div></div>';
  }
  const index = rows.findIndex(function (item) { return item.cardId === row.cardId; });
  const previousDisabled = index <= 0 || state.editing ? "disabled" : "";
  const nextDisabled = index >= rows.length - 1 || state.editing ? "disabled" : "";
  const card = '<article class="detail"><header class="detail-head"><div><span class="detail-deck">' + esc(detail.deckName) + '</span><span class="pill">' +
    (detail.suspended ? "已暂停" : "复习中") + "</span>" +
    detail.tags.map(function (tag) { return '<span class="pill">' + esc(tag) + "</span>"; }).join("") +
    "</div><small>" + (index + 1) + " / " + rows.length + '</small></header><div class="detail-body">' +
    (state.editing ? editor(detail) :
      detailCover(row) + detailFallbackTitle(row) + cardFrame(detail.questionHtml, "题面", detail.cardCss) +
      '<details class="answer" ' + (state.answerOpen ? "open" : "") +
      '><summary>查看完整答案</summary>' + cardFrame(detail.answerHtml, "答案", detail.cardCss) + "</details>") +
    '</div><div class="evidence"><div><small>最近 ' + row.recent_reviews.length +
    ' 次（旧→新）</small><strong class="review-events">' + formatReviewEvents(row.recent_reviews) +
    '</strong></div><div><small>≥40 秒 / Again</small><strong>' + row.slow_count + " / " +
    row.again_count + ' 次</strong></div><div><small>近 30 天累计</small><strong>' +
    row.total_min_30 + ' 分钟</strong></div><div><small>结构疑点</small><strong>' +
    esc(row.problems.join(" · ") || "无自动结论") + "</strong>" +
    ((row.limitations || []).length ? '<small>' + esc(row.limitations.join(" · ")) + "</small>" : "") +
    "</div></div>" + (state.editing ? "" : actionBar(detail)) + "</article>";
  return '<div class="detail-shell"><div class="nav-rail"><button class="nav-arrow nav-prev" data-step="-1" ' +
    previousDisabled + ' aria-label="上一张">‹</button></div>' + card +
    '<div class="nav-rail next"><button class="nav-arrow nav-next" data-step="1" ' + nextDisabled +
    ' aria-label="下一张">›</button></div></div>';
}

function actionBar(detail) {
  const optimizing = detail.tags.includes("需优化卡片");
  const item = (symbol, attribute, label, description) => '<button class="menu-action" role="menuitem" ' + attribute + '>' +
    icon(symbol) + '<span><strong>' + label + '</strong><small>' + description + '</small></span></button>';
  return '<footer class="detail-actions"><button class="btn primary" data-edit>编辑卡片</button>' +
    '<details class="process-menu" data-process-menu><summary class="btn" aria-haspopup="menu" aria-expanded="false">处理⌄</summary>' +
    '<div class="process-popover" role="menu" aria-label="处理当前卡片"><div class="menu-heading">复习安排</div>' +
    item(detail.suspended ? 'play' : 'pause', 'data-suspend', detail.suspended ? '恢复复习' : '暂停复习', '只改变当前卡片的复习状态') +
    item('optimize', 'data-optimize', optimizing ? '移除待优化标签' : '暂停并标记待优化', '标签影响 ' + detail.noteCardCount + ' 张卡片；移除标签不恢复复习') +
    '<div class="menu-divider" role="separator"></div><div class="menu-heading">候选与标签</div>' +
    item('hide', 'data-hide-open', '从候选中隐藏', '影响 ' + detail.noteCardCount + ' 张卡片；复习状态不变') +
    item('tag', 'data-edit-tags', '修改标签', '标签影响同一笔记的全部卡片') +
    '<div class="menu-divider" role="separator"></div>' +
    item('trash', 'data-delete', '删除笔记…', '删除笔记生成的全部卡片，下一步确认') + '</div></details></footer>';
}

function editor(detail) {
  const draft = state.draft;
  return '<form id="editor" class="editing"><p class="muted">只提交改动字段；未改动的富文本、图片引用、cloze 与回链原样保留。</p>' +
    detail.fields.map(function (field, index) {
      return "<label>" + esc(field.name) + '<textarea data-field="' + esc(field.name) + '" ' +
        (index ? 'class="back-input"' : "") + " " + (state.busy ? "disabled" : "") + ">" +
        esc(draft.fields[field.name]) + "</textarea></label>";
    }).join("") +
    '<label>标签<input id="tags" value="' + esc(draft.tags.join(" ")) + '" ' +
    (state.busy ? "disabled" : "") + '></label><div class="editor-buttons">' +
    '<button class="btn primary" type="submit" ' + (state.busy ? "disabled" : "") + ">保存</button>" +
    '<button class="btn" type="button" data-cancel ' + (state.busy ? "disabled" : "") +
    ">取消</button></div></form>";
}

function normalizeTags(tags) {
  return Array.from(new Set(tags.filter(Boolean))).sort();
}

function editValues() {
  if (!state.draft) return {changed: {}, tags: [], dirty: false};
  const changed = {};
  Object.keys(state.draft.fields).forEach(function (name) {
    const value = state.draft.fields[name];
    const original = state.draft.originalFields[name];
    if (value.replace(/\r\n?/g, "\n") !== original.replace(/\r\n?/g, "\n")) changed[name] = value;
  });
  const tags = normalizeTags(state.draft.tags);
  const dirty = Object.keys(changed).length > 0 ||
    tags.join(" ") !== normalizeTags(state.draft.originalTags).join(" ");
  return {changed: changed, tags: tags, dirty: dirty};
}

function dialogs() {
  const detail = state.detail;
  const count = detail ? detail.noteCardCount : 0;
  return '<dialog id="unsaved" class="dialog"><h2>还有未保存的修改</h2>' +
    '<p>保存当前卡片后继续，或放弃这次修改。</p><div class="dialog-actions">' +
    '<button class="btn" data-keep autofocus>继续编辑</button><button class="btn" data-discard>放弃修改</button>' +
    '<button class="btn primary" data-save-next>保存并继续</button></div></dialog>' +
    '<dialog id="hide-dialog" class="dialog"><h2>隐藏这条笔记的 ' + count + ' 张卡片？</h2>' +
    '<p>将给整条笔记添加“看板忽略”标签。卡片仍会正常复习；在 Anki 中移除该标签即可恢复候选。</p>' +
    '<div class="dialog-actions"><button class="btn" data-hide-cancel autofocus>取消</button>' +
    '<button class="btn primary" data-hide-confirm>确认隐藏</button></div></dialog>' +
    '<dialog id="delete-dialog" class="dialog"><h2 id="delete-title">确认删除</h2>' +
    '<p>删除沿用 Anki 的笔记级语义。</p><div class="dialog-actions">' +
    '<button class="btn" data-delete-cancel autofocus>取消</button>' +
    '<button class="btn danger" data-delete-confirm>删除</button></div></dialog>';
}

function startEditing(focusTags) {
  if (!state.detail || state.busy || state.preparingDelete) return;
  state.editing = true;
  state.draft = {
    cardId: state.detail.cardId,
    noteId: state.detail.noteId,
    fields: Object.fromEntries(state.detail.fields.map(function (field) { return [field.name, field.value]; })),
    originalFields: Object.fromEntries(state.detail.fields.map(function (field) { return [field.name, field.value]; })),
    tags: state.detail.tags.slice(),
    originalTags: state.detail.tags.slice(),
  };
  render();
  const target = focusTags ? root.querySelector("#tags") : root.querySelector("[data-field]");
  if (target) target.focus();
}

function requestChange(action) {
  if (state.busy || state.preparingDelete) return;
  if (!state.editing || !editValues().dirty) {
    state.editing = false;
    state.draft = null;
    action();
    applyPendingSettings();
    return;
  }
  pendingAction = action;
  const dialog = root.querySelector("#unsaved");
  if (dialog) dialog.showModal();
}

function nextCardAfter(cardId) {
  const rows = currentRows();
  const index = rows.findIndex(function (row) { return row.cardId === cardId; });
  if (index < 0) return null;
  if (rows[index + 1]) return rows[index + 1].cardId;
  return rows[index - 1] ? rows[index - 1].cardId : null;
}

async function saveNote(continueAction) {
  if (state.busy) return;
  if (!state.draft || !state.detail ||
      state.draft.noteId !== state.detail.noteId ||
      state.draft.cardId !== state.detail.cardId) {
    state.message = "保存已取消：当前卡片与草稿不一致，请重新进入编辑。";
    state.editing = false;
    state.draft = null;
    render();
    return;
  }
  const target = {noteId: state.draft.noteId, cardId: state.draft.cardId};
  const fallbackCardId = nextCardAfter(target.cardId);
  const values = editValues();
  state.busy = true;
  render();
  try {
    await send("saveNote", {
      noteId: target.noteId,
      changedFields: values.changed,
      tags: values.tags,
    });
    state.editing = false;
    state.draft = null;
    state.message = "已保存到 Anki";
    await loadDashboard({afterSave: true, preferredCardId: target.cardId, fallbackCardId: fallbackCardId});
    if (continueAction) continueAction();
  } catch (error) {
    state.busy = false;
    state.message = "保存失败：" + error.message;
    render();
  }
}

async function saveSettings(deckId, budget) {
  if (state.busy || state.settingsBusy) return;
  const previous = {deckId: state.init.selectedDeckId, budget: state.init.dailyBudgetMinutes};
  state.settingsBusy = true;
  render();
  try {
    const saved = await send("saveSettings", {deckId: deckId, dailyBudgetMinutes: budget});
    pendingSettings = saved;
    applyPendingSettings();
  } catch (error) {
    Object.assign(state.init, {
      selectedDeckId: previous.deckId,
      dailyBudgetMinutes: previous.budget,
    });
    state.settingsBusy = false;
    state.message = "设置保存失败：" + error.message;
    render();
  }
}

function applyPendingSettings() {
  if (!pendingSettings || state.busy || state.preparingDelete || root.querySelector('dialog[open]')) return;
  const saved = pendingSettings;
  const apply = () => {
    if (pendingSettings !== saved) return;
    pendingSettings = null;
    state.settingsBusy = false;
    Object.assign(state.init, {selectedDeckId: saved.deckId, dailyBudgetMinutes: saved.dailyBudgetMinutes, selectionRequired: false});
    state.dashboard = null;
    state.detail = null;
    state.selected = null;
    loadDashboard();
  };
  requestChange(apply);
}

async function mutate(command, params, successMessage) {
  if (state.busy) return;
  const preferredCardId = state.selected;
  const fallbackCardId = nextCardAfter(preferredCardId);
  state.busy = true;
  render();
  try {
    await send(command, params);
    state.message = successMessage;
    state.editing = false;
    state.draft = null;
    await loadDashboard({afterSave: true, preferredCardId: preferredCardId, fallbackCardId: fallbackCardId});
  } catch (error) {
    state.busy = false;
    const refreshed = await loadDashboard({afterSave: true, preferredCardId: preferredCardId, fallbackCardId: fallbackCardId});
    state.message = "操作未全部完成：" + error.message + (refreshed ? "；已按 Anki 实际状态刷新" : "；回读失败，请刷新确认实际状态");
    render();
  }
}

function render() {
  contentObservers.forEach(observer => observer.disconnect());
  contentObservers = [];
  cardFrameResizers = [];
  root.className = "app";
  if (!state.init) {
    root.innerHTML = '<div class="loading">正在连接 Anki…</div>';
    return;
  }
  if (state.init.selectionRequired) {
    root.innerHTML = header() + scope() + '<div class="empty">上次选择的牌组已不存在，请重新选择牌组。</div>';
    bind();
    return;
  }
  root.innerHTML = header() + scope() +
    (state.view === 'overview' && state.message ? '<div class="message" role="status">' + esc(state.message) + '</div>' : '') +
    (state.view === "overview" ? overview() : inspection()) +
    '<p class="footer-note">数据与操作均来自当前 Anki 配置档；高耗时只表示值得查看。</p>';
  bind();
  bindCardFrames();
  bindProcessMenu();
  queueLayout();
}

function bind() {
  root.querySelectorAll("[data-view]").forEach(function (button) {
    button.addEventListener("click", function () {
      requestChange(function () {
        state.view = button.dataset.view;
        state.message = "";
        render();
        if (state.view === "cards" && state.selected !== null) loadCard(state.selected, {force: true});
      });
    });
  });
  const openCards = root.querySelector("[data-open-cards]");
  if (openCards) openCards.addEventListener("click", function () {
    requestChange(() => {
      state.view = "cards"; state.queue = 'review'; state.filter = 'all';
      state.selected = currentRows()[0]?.cardId ?? null;
      render();
      if (state.selected !== null) loadCard(state.selected, {reveal: true});
    });
  });
  const refresh = root.querySelector("#refresh");
  if (refresh) refresh.addEventListener("click", function () { requestChange(function () { loadDashboard(); }); });
  const scopeSelect = root.querySelector("#scope");
  if (scopeSelect) scopeSelect.addEventListener("change", function () {
    const value = Number(scopeSelect.value);
    scopeSelect.value = state.init.selectedDeckId ?? '';
    if (value) requestChange(function () {
      saveSettings(value, state.init.dailyBudgetMinutes);
    });
  });
  const budget = root.querySelector("#budget");
  if (budget) budget.addEventListener("change", function () {
    const value = Math.round(Number(budget.value));
    budget.value = state.init.dailyBudgetMinutes;
    if (value >= 1 && value <= 1440 && state.init.selectedDeckId) {
      requestChange(function () { saveSettings(state.init.selectedDeckId, value); });
    } else {
      render();
    }
  });
  root.querySelectorAll("[data-card]").forEach(function (button) {
    button.addEventListener("click", function () {
      requestChange(function () {
        if (state.view === "overview") { state.view = "cards"; state.queue = 'review'; state.filter = 'all'; }
        loadCard(Number(button.dataset.card), {reveal: true});
      });
    });
  });
  root.querySelectorAll("[data-queue]").forEach(function (button) {
    button.addEventListener("click", function () {
      requestChange(function () {
        state.queue = button.dataset.queue;
        state.filter = "all";
        state.selected = currentRows()[0] ? currentRows()[0].cardId : null;
        state.detail = null;
        state.answerOpen = false;
        render();
        if (state.selected !== null) loadCard(state.selected, {force: true});
      });
    });
  });
  root.querySelectorAll("[data-filter]").forEach(function (button) {
    button.addEventListener("click", function () {
      requestChange(function () {
        state.filter = button.dataset.filter;
        state.selected = currentRows()[0] ? currentRows()[0].cardId : null;
        state.detail = null;
        state.answerOpen = false;
        render();
        if (state.selected !== null) loadCard(state.selected, {force: true});
      });
    });
  });
  const collapse = root.querySelector("#collapse");
  if (collapse) collapse.addEventListener("click", function () {
    const answer = root.querySelector(".answer");
    if (answer) state.answerOpen = answer.open;
    state.collapsed = !state.collapsed;
    try {
      localStorage.setItem("attention.listCollapsed", state.collapsed ? "1" : "0");
    } catch (_) {}
    root.querySelector('.inspection').classList.toggle('collapsed', state.collapsed);
    root.querySelector('.inspection-list').hidden = state.collapsed;
    collapse.setAttribute('aria-expanded', String(!state.collapsed));
    collapse.setAttribute('aria-label', state.collapsed ? '展开列表' : '收起列表');
    collapse.innerHTML = icon(state.collapsed ? 'sidebar' : 'left');
    closeProcessMenu();
    queueLayout();
  });
  const answer = root.querySelector(".answer");
  if (answer) answer.addEventListener("toggle", function () { state.answerOpen = answer.open; queueLayout(); });
  const sort = root.querySelector('#sort');
  if (sort) sort.addEventListener('change', () => {
    const value = sort.value; sort.value = state.sort;
    requestChange(() => {
      state.sort = value;
      state.selected = currentRows()[0]?.cardId ?? null;
      render();
      if (state.selected !== null) loadCard(state.selected, {reveal: true});
    });
  });
  root.querySelectorAll("[data-step]").forEach(function (button) {
    button.addEventListener("click", function () {
      const rows = currentRows();
      const index = rows.findIndex(function (row) { return row.cardId === state.selected; });
      const next = rows[index + Number(button.dataset.step)];
      if (navigationBlocked()) return;
      if (next) requestChange(function () { loadCard(next.cardId, {reveal: true}); });
    });
  });
  const edit = root.querySelector("[data-edit]");
  if (edit) edit.addEventListener("click", function () { startEditing(false); });
  const editTags = root.querySelector("[data-edit-tags]");
  if (editTags) editTags.addEventListener("click", function () { startEditing(true); });
  root.querySelectorAll("[data-field]").forEach(function (field) {
    field.addEventListener("input", function () { state.draft.fields[field.dataset.field] = field.value; });
  });
  const tags = root.querySelector("#tags");
  if (tags) tags.addEventListener("input", function () {
    state.draft.tags = tags.value.trim().split(/\s+/).filter(Boolean);
  });
  const cancel = root.querySelector("[data-cancel]");
  if (cancel) cancel.addEventListener("click", function () {
    requestChange(function () {
      state.editing = false;
      state.draft = null;
      render();
    });
  });
  const editorForm = root.querySelector("#editor");
  if (editorForm) editorForm.addEventListener("submit", function (event) {
    event.preventDefault();
    saveNote();
  });
  const suspend = root.querySelector("[data-suspend]");
  if (suspend) suspend.addEventListener("click", function () {
    mutate("setSuspended", {cardId: state.selected, suspended: !state.detail.suspended},
      state.detail.suspended ? "已恢复复习" : "已暂停当前卡片");
  });
  const optimize = root.querySelector("[data-optimize]");
  if (optimize) optimize.addEventListener("click", function () {
    mutate("setOptimization", {
      cardId: state.selected,
      enabled: !state.detail.tags.includes("需优化卡片"),
    }, "待优化状态已更新");
  });
  const hideOpen = root.querySelector("[data-hide-open]");
  if (hideOpen) hideOpen.addEventListener("click", function () {
    if (state.busy) return;
    closeProcessMenu();
    root.querySelector("#hide-dialog").showModal();
  });
  const hideCancel = root.querySelector("[data-hide-cancel]");
  if (hideCancel) hideCancel.addEventListener("click", function () { root.querySelector("#hide-dialog").close(); applyPendingSettings(); });
  const hideConfirm = root.querySelector("[data-hide-confirm]");
  if (hideConfirm) hideConfirm.addEventListener("click", function () {
    root.querySelector("#hide-dialog").close();
    const count = state.detail.noteCardCount;
    mutate("setHidden", {cardId: state.selected, enabled: true},
      "已隐藏整条笔记的 " + count + " 张卡片；复习状态未改变。移除“看板忽略”标签可恢复。");
  });
  const deleteButton = root.querySelector("[data-delete]");
  if (deleteButton) deleteButton.addEventListener("click", async function () {
    if (state.busy || state.preparingDelete) return;
    closeProcessMenu();
    const cardId = state.selected, requestGeneration = generation;
    state.preparingDelete = true;
    try {
      const confirmed = await send("prepareDelete", {cardId});
      if (cardId !== state.selected || requestGeneration !== generation) return;
      state.confirmedDelete = confirmed;
      root.querySelector("#delete-title").textContent =
        "删除这条笔记及其 " + state.confirmedDelete.cardCount + " 张卡片？";
      root.querySelector("#delete-dialog").showModal();
    } catch (error) {
      state.message = "无法准备删除：" + error.message;
      render();
    } finally {
      state.preparingDelete = false;
      applyPendingSettings();
    }
  });
  const deleteCancel = root.querySelector("[data-delete-cancel]");
  if (deleteCancel) deleteCancel.addEventListener("click", function () {
    root.querySelector("#delete-dialog").close();
    applyPendingSettings();
  });
  const deleteConfirm = root.querySelector("[data-delete-confirm]");
  if (deleteConfirm) deleteConfirm.addEventListener("click", function () {
    root.querySelector("#delete-dialog").close();
    mutate("deleteNote", {
      noteId: state.confirmedDelete.noteId,
      confirmedCardIds: state.confirmedDelete.cardIds,
    }, "笔记及其 " + state.confirmedDelete.cardCount + " 张卡片已删除");
  });
  const unsaved = root.querySelector("#unsaved");
  const keep = root.querySelector("[data-keep]");
  if (keep) keep.addEventListener("click", function () {
    pendingAction = null;
    unsaved.close();
  });
  const discard = root.querySelector("[data-discard]");
  if (discard) discard.addEventListener("click", function () {
    const action = pendingAction;
    pendingAction = null;
    state.editing = false;
    state.draft = null;
    unsaved.close();
    if (action) action();
    applyPendingSettings();
  });
  const saveNext = root.querySelector("[data-save-next]");
  if (saveNext) saveNext.addEventListener("click", function () {
    const action = pendingAction;
    pendingAction = null;
    unsaved.close();
    saveNote(action);
  });
}

function navigationBlocked() {
  return state.view !== 'cards' || state.editing || state.busy || state.preparingDelete ||
    !!root.querySelector('dialog[open],.process-menu[open]');
}

document.addEventListener("keydown", function (event) {
  if (navigationBlocked() || event.defaultPrevented || event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || event.repeat ||
      event.target.closest('input,textarea,select,[contenteditable],dialog,[role="menu"]')) return;
  if (event.key === "ArrowLeft" || event.key === "ArrowRight") {
    const button = root.querySelector(event.key === "ArrowLeft" ? ".nav-prev" : ".nav-next");
    if (button && !button.disabled) { event.preventDefault(); button.click(); }
  }
});

root.addEventListener('keydown', event => {
  if (event.key !== 'Escape') return;
  const dialog = root.querySelector('dialog[open]');
  if (!dialog) return;
  event.preventDefault(); event.stopPropagation();
  if (dialog.id === 'unsaved') pendingAction = null;
  dialog.close();
  if (dialog.id !== 'unsaved') applyPendingSettings();
});

document.addEventListener("pointerdown", function (event) {
  document.querySelectorAll(".process-menu[open]").forEach(function (menu) {
    if (!menu.contains(event.target)) closeProcessMenu();
  });
});

window.addEventListener('resize', () => {
  closeProcessMenu();
  cardFrameResizers.forEach(resize => resize());
  queueLayout();
});
document.addEventListener('scroll', event => {
  if (!event.target.closest?.('.process-popover')) closeProcessMenu();
  queueLayout();
}, true);

bridgeReady(initialize);
</script>
</body>
</html>
