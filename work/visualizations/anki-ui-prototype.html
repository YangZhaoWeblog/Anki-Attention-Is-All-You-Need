@media(max-width:680px){.app{padding:0 16px 105px}.app-header{align-items:flex-start;gap:12px;padding:17px 0}.brand{font-size:14px}.mark{width:28px;height:28px;font-size:24px}.header-nav{gap:14px;font-size:12px}.preview-label{max-width:190px;font-size:10px}.scope-row{margin-top:21px}.scope-row h1{font-size:26px}.settings{gap:10px}.settings label{font-size:11px}.briefing{grid-template-columns:1fr}.big-amount b{font-size:68px}.recommendation{padding:23px}.recommendation .btn{margin-top:15px}.card-grid{grid-template-columns:1fr}.candidate-tile{display:grid;grid-template-columns:96px minmax(0,1fr)}.tile-art{height:100%;min-height:150px;border-bottom:0;border-right:1px solid var(--line);padding:9px}.tile-body h3{min-height:0;font-size:13px}.tile-meta{flex-direction:row;align-items:baseline}.tile-body{padding:13px}.section-head h2{font-size:18px}.section-head{gap:8px}.section-head small{font-size:10px}.today-line{font-size:11px}.inspection{display:block}.inspection-list{display:flex;overflow:auto;margin-bottom:17px}.mini-card{min-width:210px;max-width:210px;border-bottom:0;border-right:1px solid var(--line)}.mini-card.selected{box-shadow:inset 0 3px var(--green)}.inspection-heading{align-items:flex-start;flex-wrap:wrap}.detail-head,.detail-body,.evidence,.detail-actions{padding:17px}.detail-head{gap:8px}.detail-head .btn{font-size:12px}.question-text{font-size:16px}.detail-actions .btn{font-size:12px;padding:8px 10px}}

/* Approved Prism White: concentrated light, neutral reading surfaces. */
body { background: linear-gradient(180deg, #fff 0, #fdfdff 650px); }
.app { padding-bottom: 44px; }
h1 { font-size: 32px; font-weight: 680; color: #101015; }
.mark {
  background: radial-gradient(ellipse at 0 0, #edaef0, transparent 68%),
    linear-gradient(145deg, #ab9efc, #6635ef 68%, #4a26d5);
  box-shadow: inset 0 1px 1px #ffffff90, 0 2px 5px #6333ed16;
}
.btn { border-radius: 10px; transition: background .16s, box-shadow .16s; }
.btn:hover { background: #f8f7fc; }
.btn.primary {
  background: linear-gradient(115deg, #6938f5, #6130eb);
  border-color: #6633ee;
  box-shadow: inset 0 1px 0 #ffffff25, 0 3px 8px #6333ed18;
}
.btn.primary:hover { background: #5626dc; box-shadow: 0 4px 12px #6333ed25; }
.btn.quiet:hover { background: transparent; text-decoration: underline; text-underline-offset: 4px; }
.settings select, .settings input { border-radius: 9px; }
.briefing { border-radius: 20px; box-shadow: 0 12px 30px #4427720c, 0 3px 7px #44277203; }
.budget-ticket {
  min-height: 285px; padding: 30px; color: var(--ink);
  background:
    radial-gradient(ellipse at -8% 110%, #9990ffaf 0, #b7adff42 28%, transparent 59%),
    radial-gradient(ellipse at 104% 110%, #f7bce999 0, #fce3ef65 30%, transparent 60%),
    radial-gradient(ellipse at 102% -12%, #c3b6fa70 0, transparent 57%),
    linear-gradient(128deg, #efedfc, #faf9ff 48%, #fff8fc);
}
.budget-ticket .kicker { color: #4b465e; letter-spacing: .8px; }
.big-amount { margin: 19px 0 22px; }
.big-amount b {
  font: 650 88px/.97 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  letter-spacing: -4.5px; color: #101015; font-variant-numeric: lining-nums tabular-nums;
}
.big-amount span, .ticket-bottom small { color: #60596f; }
.ticket-bottom { border-color: #65537b20; gap: 38px; }
.ticket-bottom strong { color: #211b30; font-size: 19px; font-weight: 600; }
.recommendation { padding: 30px; background: #fff; }
.recommendation h2 { color: #17131d; font-size: 26px; font-weight: 650; }
.recommendation p { color: #696576; }
.recommendation .btn { margin-top: 22px; }
.card-grid { gap: 18px; }
.candidate-tile { border-radius: 17px; box-shadow: 0 5px 15px #34244b07; }
.candidate-tile:hover { transform: translateY(-2px); border-color: #cbbced; box-shadow: 0 10px 22px #48316b12; }
.tile-art { background: linear-gradient(150deg, #fafaff, #ffffff 76%); border-bottom-color: #f0eef5; }
.tile-body .reason { color: #746580; }
.tile-meta { border-color: #ece9f1; }
.tile-meta strong { color: #252131; }
.filter-group { background: #f2eff8; padding: 4px; border-radius: 10px; }
.filter-group button.active { color: #5129be; background: #fff; box-shadow: 0 1px 4px #3c2c5010; }
.signal-options button.active { background: #f3edff; color: #5726c5; }
.inspection-list { border-radius: 14px; }
.mini-card.selected { background: #f7f3ff; box-shadow: inset 3px 0 #9275e6; }
.mini-card:hover { background: #faf8ff; }
.detail { border-radius: 18px; box-shadow: 0 7px 22px #39265108; }
.detail-head { background: #fdfcfe; }
.evidence { background: #faf9fc; }
.pill { background: #f4f2f7; color: #625a70; }
.pill.warn { background: var(--shade); color: var(--danger); }
.editing textarea:focus, .editing input:focus { border-color: #a38adf; }
@media (max-width: 900px) {
  .budget-ticket, .recommendation { padding: 24px; }
  .big-amount b { font-size: 76px; }
  .card-grid { gap: 12px; }
}
@media (max-width: 680px) {
  .app { padding-bottom: 32px; }
  .budget-ticket { min-height: 248px; }
  .big-amount b { font-size: 76px; }
  .recommendation h2 { font-size: 23px; }
  .mini-card.selected { box-shadow: inset 0 3px #9275e6; }
}

/* One primary action, an anchored processing menu, and explicit note deletion. */
.detail-actions { gap: 12px; align-items: center; padding: 20px 24px; }
.detail-actions .btn { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; border-radius: 999px; }
.action-icon { width: 19px; height: 19px; flex: none; }
.btn.action-trigger { border-color: transparent; background: transparent; color: #625a70; }
.btn.action-trigger:hover, .btn.action-trigger[aria-expanded="true"] { background: #f3eefb; color: #5427c1; }
.action-trigger .chevron { width: 14px; height: 14px; transition: transform .15s; }
.action-trigger[aria-expanded="true"] .chevron { transform: rotate(180deg); }
.action-menu {
  position: fixed; z-index: 40; width: 310px; max-width: calc(100vw - 24px);
  max-height: calc(100vh - 24px); overflow: auto; padding: 7px;
  background: #fff; border: 1px solid #e9e3f1; border-radius: 17px;
  box-shadow: 0 16px 45px #31204422, 0 3px 8px #3120440b;
  animation: menu-enter .14s ease-out;
}
.menu-heading { padding: 7px 10px 3px; font-size: 10px; color: #756a7c; letter-spacing: .8px; }
.menu-divider { height: 1px; background: #efebf4; margin: 6px 5px; }
.action-item {
  display: flex; align-items: flex-start; gap: 11px; width: 100%;
  padding: 10px; border: 0; border-radius: 10px; background: none; text-align: left;
  color: #302637; transition: background .12s;
}
.action-item .action-icon { margin-top: 2px; color: #8a7a9a; }
.action-item strong { display: block; font-size: 13px; font-weight: 550; }
.action-item small { display: block; margin-top: 3px; font-size: 11px; line-height: 1.5; color: #756a7c; }
.action-item:hover, .action-item:focus-visible { background: #f6f0ff; }
.action-item:focus-visible { outline: 2px solid #8c6bcc; outline-offset: -2px; }
.action-item.delete-item, .action-item.delete-item .action-icon { color: #b63f50; }
.action-item.delete-item:hover, .action-item.delete-item:focus-visible { background: #fff2f4; }
.live-message { padding: 12px 16px; margin: 0 0 15px; border-radius: 12px; background: #f5f0fc; color: #654c86; }
.delete-dialog { width: 440px; max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); overflow: auto; padding: 28px; border: 1px solid #ede5ed; border-radius: 22px; color: var(--ink); box-shadow: 0 24px 80px #271b3633; }
.delete-dialog::backdrop { background: #21172f40; }
.delete-symbol { display: grid; place-items: center; width: 42px; height: 42px; border-radius: 14px; color: #b63f50; background: #fff0f3; margin-bottom: 17px; }
.delete-dialog h2 { font-size: 21px; line-height: 1.45; }
.delete-dialog p { margin-top: 13px; font-size: 13px; color: #756a7c; }
.delete-preview { margin: 16px 0; padding: 12px 14px; border: 1px solid #eee9f1; border-radius: 12px; background: #fcfafd; font-size: 13px; line-height: 1.7; overflow-wrap: anywhere; }
.delete-dialog .dialog-actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 22px; }
.btn.delete-confirm { color: #fff; background: #b63f50; border-color: #b63f50; }
.btn.delete-confirm:hover { background: #9e3040; }
@keyframes menu-enter { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: translateY(0); } }
@media(max-width:680px) { .detail-actions { padding: 17px; }.delete-dialog { padding: 22px; } }
/* Browse in the list; fold it away for focused reading. */
.inspection { grid-template-columns: 255px minmax(0, 1fr); gap: 30px; }
.inspection-list { border: 0; border-radius: 0; background: transparent; }
.mini-card { padding: 15px; margin-bottom: 5px; border: 0; border-radius: 12px; }
.mini-card h3 { -webkit-line-clamp: 2; font-weight: 400; color: #71697b; }
.mini-card.selected h3 { font-weight: 550; color: #33263f; }
.mini-card .mini-meta { display: block; color: #7a7085; margin-top: 8px; }
.inspection-workspace { width: 100%; scroll-margin-top: 8px; }
.inspection-workspace.is-focused { max-width: 760px; margin-inline: auto; }
.inspection-workspace.is-focused .inspection { grid-template-columns: minmax(0, 1fr); }
.inspection-nav { display: grid; grid-template-columns: 255px minmax(0,1fr); gap: 30px; align-items: center; min-height: 32px; margin-bottom: 8px; }
.list-toggle { justify-self: end; display: grid; place-items: center; width: 28px; height: 28px; padding: 4px; border: 0; border-radius: 4px; color: #857991; background: transparent; }
.list-toggle:hover, .list-toggle:focus-visible { background: transparent; color: #6333ed; }
.list-toggle .action-icon { width: 18px; height: 18px; transition: color .18s, transform .18s; }
.list-toggle[aria-expanded="false"]:hover .action-icon { transform: translateX(2px); }
/* The divider is the affordance; the transparent hit area is deliberately larger. */
.list-toggle.is-handle { position: fixed; z-index: 17; width: 22px; height: 56px; padding: 0; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
.list-toggle.is-handle::before {
  content: ''; position: absolute; right: 3px; top: 50%; width: 2px; height: 28px;
  border-radius: 2px; transform: translateY(-50%); background: #9986ad;
  transition: height .18s, background .18s, box-shadow .18s;
}
.list-toggle.is-handle::after { content: ''; position: absolute; inset: 0 -4px; }
.list-toggle.is-handle .action-icon { width: 14px; height: 14px; margin-right: 9px; opacity: 0; transform: translateX(3px); transition: opacity .16s, transform .18s; }
.list-toggle.is-handle:hover::before, .list-toggle.is-handle:focus-visible::before {
  height: 40px; background: linear-gradient(180deg, #b495ee, #7951c5 58%, #c78bb9);
  box-shadow: 0 0 10px #a680de40;
}
.list-toggle.is-handle:hover .action-icon, .list-toggle.is-handle:focus-visible .action-icon { opacity: 1; transform: translateX(0); }
@media (hover:none), (pointer:coarse) { .list-toggle.is-handle .action-icon { opacity: 1; transform: none; } }
.edit-dialog { width: 430px; max-width: calc(100vw - 32px); max-height: calc(100vh - 32px); overflow: auto; padding: 26px; color: var(--ink); border: 1px solid var(--line); border-radius: 20px; box-shadow: 0 20px 70px #28133730; }
.edit-dialog::backdrop { background: #21172f40; }
.edit-dialog h2 { font-size: 21px; }
.edit-dialog p { margin-top: 12px; color: var(--muted); font-size: 13px; }
.edit-dialog-actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 9px; margin-top: 23px; }
.inspection-workspace.is-focused .inspection-nav { grid-template-columns: 28px minmax(0,1fr) 28px; gap: 0; }
.inspection-workspace.is-focused .list-toggle { justify-self: start; }
.card-position { grid-column: 2; justify-self: center; font-size: 11px; color: #857991; font-variant-numeric: tabular-nums; }
.card-position.detached { font-size: 11px; }
.reading-stage { position: relative; min-width: 0; }
.card-step {
  position: fixed; z-index: 16; display: grid; place-items: center; width: 42px; height: 42px;
  border: 1px solid #e7e0ee; border-radius: 50%; padding: 0;
  color: #7c609e; background: #ffffffed; box-shadow: 0 4px 14px #38204e10;
  opacity: 0; pointer-events: none; transition: opacity .16s, background .16s, box-shadow .16s;
}
.card-step .action-icon { width: 20px; height: 20px; }
.reading-stage:hover .card-step { opacity: 1; pointer-events: auto; }
.reading-stage:hover .card-step:disabled { opacity: .28; pointer-events: none; }
.card-step:hover:not(:disabled), .card-step:focus-visible {
  background: linear-gradient(135deg, #f0eaff, #fbeaf5); color: #6333ed;
  border-color: #d9c6ef; box-shadow: 0 5px 18px #7243af22; opacity: 1; pointer-events: auto;
}
@media (hover:none), (pointer:coarse) {
  .card-step { opacity: 1; pointer-events: auto; }
  .card-step:disabled { opacity: .28; pointer-events: none; }
}
.detail.card-enter { animation: card-enter .16s ease-out; }
@keyframes card-enter { from { opacity: .65; } to { opacity: 1; } }
@media(max-width:900px) { .inspection, .inspection-nav { grid-template-columns: 220px minmax(0,1fr); gap: 24px; } }
@media(max-width:680px) {
  .inspection { display: block; }
  .inspection-list { gap: 5px; }
  .mini-card { min-width: 195px; max-width: 195px; border-right: 0; }
  .inspection-nav { grid-template-columns: 28px minmax(0,1fr) 28px; gap: 0; }
  .list-toggle { justify-self: start; }
  .reading-stage { margin-inline: 16px; }
  .reading-stage .detail-body, .reading-stage .evidence { padding-inline: 24px; }
}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>

const state={view:params.get('view')==='cards'?'cards':'overview',scope:'ALL',budget:30,filter:'all',signal:'all',sort:'recent',selected:null,editing:false,message:'',listCollapsed:readListPreference()};

function carouselPlacement(rect,viewportWidth,viewportHeight){
  const size=42,margin=12;
  const visibleTop=Math.max(margin,rect.top),visibleBottom=Math.min(viewportHeight-margin,rect.bottom);
  const clampX=x=>Math.max(margin,Math.min(x,viewportWidth-size-margin));
  return {
    visible:visibleBottom-visibleTop>=80&&rect.right>margin&&rect.left<viewportWidth-margin,
    top:(visibleTop+visibleBottom-size)/2,
    previousLeft:clampX(rect.left-size/2),
    nextLeft:clampX(rect.right-size/2)
  };
}
function positionCarouselControls(){
  positionListHandle();
  const stage=app.querySelector('.reading-stage');
  if(!stage)return;
  const position=carouselPlacement(stage.getBoundingClientRect(),window.innerWidth,window.innerHeight);
  stage.querySelectorAll('[data-step]').forEach(button=>{
    button.hidden=!position.visible||state.editing;
    button.style.top=position.top+'px';
    button.style.left=(button.dataset.step==='-1'?position.previousLeft:position.nextLeft)+'px';
  });
}
function listHandlePlacement(listRect,cardRect,viewportHeight){
  const top=Math.max(12,listRect.top),bottom=Math.min(viewportHeight-12,listRect.bottom);
  const arrowCenter=(Math.max(12,cardRect.top)+Math.min(viewportHeight-12,cardRect.bottom))/2;
  const minimum=top+28,maximum=bottom-28,middle=(top+bottom)/2;
  let center=middle;
  if(Math.abs(center-arrowCenter)<66){
    const candidates=[arrowCenter-66,arrowCenter+66].filter(y=>y>=minimum&&y<=maximum);
    center=candidates.sort((a,b)=>Math.abs(a-middle)-Math.abs(b-middle))[0]
      ??(Math.abs(minimum-arrowCenter)>Math.abs(maximum-arrowCenter)?minimum:maximum);
  }
  return {visible:bottom-top>=160&&Math.abs(center-arrowCenter)>=52,left:(listRect.right+cardRect.left)/2-11,top:center-28};
}
function positionListHandle(){
  const button=app.querySelector('#list-toggle'),list=app.querySelector('#inspection-list'),stage=app.querySelector('.reading-stage');
  if(!button)return;
  const position=!state.listCollapsed&&window.innerWidth>680&&stage?listHandlePlacement(list.getBoundingClientRect(),stage.getBoundingClientRect(),window.innerHeight):null;
  const floating=Boolean(position?.visible);
  button.classList.toggle('is-handle',floating);

  button.style.top=floating?position.top+'px':'';
}
function queueCarouselPosition(){

function observeCarousel(){

function bindActionMenu(){

    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();openActionMenu(e.key==='ArrowUp');}

    if(e.key==='Escape'){e.preventDefault();closeActionMenu(true);return;}
    if(e.key==='Tab'){closeActionMenu(true);return;}
    const items=[...menu.querySelectorAll('[role="menuitem"]')];
    const index=items.indexOf(document.activeElement);
    let next;
    if(e.key==='ArrowDown')next=(index+1)%items.length;
    if(e.key==='ArrowUp')next=(index-1+items.length)%items.length;
    if(e.key==='Home')next=0;

  const answer=card.back.startsWith(card.front)?card.back.slice(card.front.length).trim():card.back;
  const issues=qualityIssues(card);
  return `<article class="detail"><header class="detail-head"><div class="detail-tags"><span class="pill">${card.paused?'已暂停':'复习中'}</span>${card.tags.map(t=>`<span class="pill">${esc(t)}</span>`).join('')}</div></header><div class="detail-body">${state.editing?editor(card):`<div class="field-label">题面 · ${esc(shortDeck(card))}</div><div class="question-text">${esc(card.front)}</div>${card.images.filter(im=>im.side==='front').map(im=>`<img class="card-image" src="${im.src}" alt="Anki 题面图片">`).join('')}<details class="answer-details"><summary>查看完整答案</summary><div class="answer-text">${esc(answer)}</div>${card.images.filter(im=>im.side==='back').map(im=>`<img class="card-image" src="${im.src}" alt="Anki 答案图片">`).join('')}</details>${source?`<div class="details-source"><a href="${esc(source)}">原字段回链 ↗</a></div>`:''}`}</div><div class="evidence"><div><small>最近 ${card.lastTimes.length} 次耗时（旧→新）</small><strong>${card.lastTimes.join(' · ')} 秒</strong></div><div><small>≥60 秒 / Again</small><strong>${slowCount(card)} / ${card.againRecent} 次</strong></div><div><small>上次复习</small><strong>${card.lastDate}</strong></div><div><small>近 30 天累计</small><strong>${card.min30} 分钟</strong></div>${issues.length?`<div><small>结构疑点 · 需人工判断</small><strong>${esc(issues.join(' · '))}</strong></div>`:''}</div>${state.editing?'':actionBar()}</article>`;
}
function editor(card){return `<form id="editor" class="editing"><p class="edit-note">操作演示：更改仅保留在当前预览，不写入 Anki。</p><label>题面<textarea id="front-field">${esc(card.front)}</textarea></label><label>答案<textarea id="back-field" class="back-input">${esc(card.back)}</textarea></label><label>标签（用空格分隔）<input id="tags-field" value="${esc(card.tags.join(' '))}"><span class="field-hint">“看板忽略”排除候选；“需优化卡片”进入待优化，同时存在时仍显示待优化。</span></label><div class="editor-buttons"><button class="btn primary" type="submit">保存</button><button class="btn" type="button" data-cancel="1">取消</button></div></form>`;}
function normalizedTags(tags){return [...new Set(tags.filter(Boolean))].sort();}
function editorValues(){
  return {
    front:app.querySelector('#front-field').value,
    back:app.querySelector('#back-field').value,
    tags:normalizedTags(app.querySelector('#tags-field').value.trim().split(/\s+/))
  };
}
function hasUnsavedEdits(){
  if(!state.editing)return false;
  const card=cards.find(c=>c.id===state.selected),values=editorValues();
  const text=value=>String(value).replace(/\r\n?/g,'\n');
  return text(values.front)!==text(card.front)||text(values.back)!==text(card.back)||JSON.stringify(values.tags)!==JSON.stringify(normalizedTags(card.tags));
}
function saveEditorValues(){
  const card=cards.find(c=>c.id===state.selected);
  if(!card||!state.editing)return false;
  updateNote(card,editorValues());
  return true;
}
function unsavedDialog(){
  return `<dialog class="edit-dialog" id="unsaved-dialog" aria-labelledby="unsaved-title" aria-describedby="unsaved-description">
    <h2 id="unsaved-title">还有未保存的修改</h2>
    <p id="unsaved-description">保存后继续，或放弃这次修改。当前仍是原型演示，不写入 Anki。</p>
    <div class="edit-dialog-actions">
      <button class="btn" type="button" data-keep-editing="1" autofocus>继续编辑</button>
      <button class="btn" type="button" data-discard-edit="1">放弃修改</button>
      <button class="btn primary" type="button" data-save-continue="1">保存并继续</button>
    </div>
  </dialog>`;
}
function requestPageChange(action){
  if(!hasUnsavedEdits()){state.editing=false;action();return;}
  pendingEditAction=action;
  app.querySelector('#unsaved-dialog').showModal();
}
function finishPendingEdit(save){
  if(save&&!saveEditorValues())return;
  const action=pendingEditAction;
  pendingEditAction=null;state.editing=false;
  app.querySelector('#unsaved-dialog').close();
  action?.();
  (app.querySelector('.card-position')||app.querySelector('[data-view="overview"]'))?.focus({preventScroll:true});
}
function bindEditGuard(){
  const dialog=app.querySelector('#unsaved-dialog');
  if(!dialog)return;
  dialog.querySelector('[data-keep-editing]').addEventListener('click',()=>dialog.close());
  dialog.querySelector('[data-discard-edit]').addEventListener('click',()=>finishPendingEdit(false));
  dialog.querySelector('[data-save-continue]').addEventListener('click',()=>finishPendingEdit(true));
  dialog.addEventListener('close',()=>{
    if(state.editing){pendingEditAction=null;app.querySelector('#front-field')?.focus({preventScroll:true});}
  });
}
function render(){
  app.className='app';
  const content=state.view==='cards'?inspection():overview();
  const selected=cards.find(c=>c.id===state.selected);
  const overlays=state.editing?unsavedDialog():state.view==='cards'&&selected?actionMenu(selected)+deletionDialog():'';
  app.innerHTML=header()+content+'<p class="footer-note">交互原型 · 操作只影响本页，刷新后恢复样例，不写入 Anki。</p>'+overlays;
  bind();
  observeCarousel();
}
function updateNote(card,patch){cards.filter(c=>c.noteId===card.noteId).forEach(c=>Object.assign(c,patch,patch.tags?{tags:[...patch.tags]}:{}));}
function bind(){
  bindActionMenu();
  bindEditGuard();
  app.querySelector('#list-toggle')?.addEventListener('click',toggleList);
  app.querySelectorAll('[data-step]').forEach(button=>button.addEventListener('click',()=>moveCard(Number(button.dataset.step))));
  app.querySelectorAll('[data-view]').forEach(b=>b.addEventListener('click',()=>{
    requestPageChange(()=>{state.view=b.dataset.view;state.filter='all';state.signal='all';state.sort='recent';state.message='';state.selected=null;render();window.scrollTo(0,0);});
  }));
  app.querySelectorAll('[data-card]').forEach(b=>b.addEventListener('click',()=>{
    if(state.editing)return;
    state.selected=Number(b.dataset.card);state.view='cards';state.editing=false;state.message='';render();
  }));
  app.querySelectorAll('[data-filter]').forEach(b=>b.addEventListener('click',()=>{
    if(state.filter===b.dataset.filter)return;
    requestPageChange(()=>{state.filter=b.dataset.filter;state.signal='all';state.selected=filtered()[0]?.id;state.message='';render();});
  }));
  app.querySelectorAll('[data-signal]').forEach(b=>b.addEventListener('click',()=>{
    if(state.signal===b.dataset.signal)return;
    requestPageChange(()=>{state.signal=b.dataset.signal;state.selected=filtered()[0]?.id;state.message='';render();});
  }));
  app.querySelector('#sort')?.addEventListener('change',e=>{
    const value=e.target.value;e.target.value=state.sort;
    if(value===state.sort)return;
    requestPageChange(()=>{state.sort=value;state.selected=filtered()[0]?.id;state.message='';render();});
  });
  app.querySelector('#scope')?.addEventListener('change',e=>{
    const value=e.target.value;e.target.value=state.scope;
    if(value===state.scope)return;
    requestPageChange(()=>{state.scope=value;state.selected=filtered()[0]?.id;state.message='';render();});
  });
  app.querySelector('#budget')?.addEventListener('change',e=>{
    const n=Number(e.target.value);e.target.value=state.budget;
    if(!Number.isFinite(n)||n<1||n>1440||Math.round(n)===state.budget)return;
    requestPageChange(()=>{state.budget=Math.round(n);render();});
  });
  app.querySelectorAll('[data-edit]').forEach(b=>b.addEventListener('click',()=>{state.editing=true;state.message='';render();app.querySelector(b.dataset.edit==='tags'?'#tags-field':'#front-field')?.focus();}));
  app.querySelector('[data-cancel]')?.addEventListener('click',()=>requestPageChange(()=>{render();app.querySelector('[data-edit]')?.focus({preventScroll:true});}));
  app.querySelector('#editor')?.addEventListener('submit',e=>{
    e.preventDefault();if(!saveEditorValues())return;
    state.editing=false;state.message='内容和标签预览已更新 · 实际 Anki 未改动';render();app.querySelector('[data-edit]')?.focus({preventScroll:true});
  });
  app.querySelector('[data-pause]')?.addEventListener('click',()=>{
    const c=cards.find(c=>c.id===state.selected);c.paused=!c.paused;state.message=(c.paused?'已演示暂停':'已演示恢复')+' · 实际 Anki 未改动';render();focusActionTrigger();
  });
  app.querySelector('[data-optimize]')?.addEventListener('click',()=>{
    const c=cards.find(c=>c.id===state.selected);
    if(c.tags.includes('需优化卡片'))updateNote(c,{tags:c.tags.filter(t=>t!=='需优化卡片')});
    else{updateNote(c,{tags:[...c.tags,'需优化卡片']});c.paused=true;}
    state.message='标签预览已更新 · 实际 Anki 未改动';render();focusActionTrigger();
  });
  app.querySelector('[data-hide]')?.addEventListener('click',()=>{
    const c=cards.find(c=>c.id===state.selected);updateNote(c,{tags:[...c.tags,'看板忽略']});
    state.message='已从候选中隐藏，复习状态未改变。可在 Anki 移除“看板忽略”标签找回。此处仅为预览。';render();focusActionTrigger();
  });
}
document.addEventListener('keydown',handleCardNavigationKey);
document.addEventListener('pointerdown',e=>{
  if(!e.target.closest('#card-action-menu,#card-action-trigger'))closeActionMenu();
});
window.addEventListener('resize',()=>{closeActionMenu(true);queueCarouselPosition();});
document.addEventListener('scroll',e=>{
  if(!e.target.closest?.('#card-action-menu'))closeActionMenu(true);
  queueCarouselPosition();
},true);
render();
</script>
</body>
</html>
