  background-color: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-select:focus-visible {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-check {
  display: flex;
  min-height: 20px;
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  border-color: var(--input);
  border-radius: var(--radius-sm);
  corner-shape: var(--corner-shape);
  background-color: var(--secondary);
  box-shadow: var(--shadow-sm);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible,
.nav-link:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

@media (pointer: coarse) {

  .nav-link,
  .form-control,
  .form-select {
    min-width: 44px;
    min-height: 44px;

  }

  }

  .form-check-input::after {

    left: 50%;

    height: 44px;
    content: &quot;&quot;;

  }

  .form-check-label {

    min-width: 44px;

  }

    height: 44px;
  }

  .form-range::-moz-range-track {
    height: 44px;
  }

  .form-range::-webkit-slider-thumb {
    margin-top: 12px;
  }

svg {

.text-warning,

&lt;div id=&quot;anki-home-sketch&quot; aria-label=&quot;Anki 注意力看板首页草图&quot;&gt;
  &lt;div class=&quot;a-chrome&quot;&gt;&lt;span class=&quot;a-name&quot;&gt;Attention Is All You Need&lt;/span&gt;&lt;span class=&quot;a-meta&quot;&gt;首页草图 · 示例数据&lt;/span&gt;&lt;/div&gt;

      &lt;div class=&quot;a-comparison&quot; role=&quot;img&quot; id=&quot;a-bars&quot; aria-label=&quot;预计复习464分钟，预算150分钟&quot;&gt;
        &lt;span&gt;预计复习&lt;/span&gt;&lt;div class=&quot;a-track&quot;&gt;&lt;i class=&quot;a-fill a-forecast-fill&quot; id=&quot;a-forecast&quot; style=&quot;width:100%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;span class=&quot;a-value&quot;&gt;464 分钟&lt;/span&gt;
        &lt;span&gt;可用预算&lt;/span&gt;&lt;div class=&quot;a-track&quot;&gt;&lt;i class=&quot;a-fill a-budget-fill&quot; id=&quot;a-budget-bar&quot; style=&quot;width:32.33%&quot;&gt;&lt;/i&gt;&lt;/div&gt;&lt;span class=&quot;a-value&quot; id=&quot;a-total&quot;&gt;150 分钟&lt;/span&gt;

&lt;script&gt;
(() =&gt; {
  const root = document.getElementById(&quot;anki-home-sketch&quot;);
  const input = root.querySelector(&quot;#a-budget&quot;);
  function renderBudget() {
    const daily = Number(input.value);
    if (!Number.isFinite(daily) || daily &lt; 1 || daily &gt; 1440) { input.setCustomValidity(&quot;请输入 1 至 1440 分钟&quot;); input.reportValidity(); return; }
    input.setCustomValidity(&quot;&quot;);
    const total = Math.round(daily * 5);
    const maximum = Math.max(total,464);
    root.querySelector(&quot;#a-total&quot;).textContent = total + &quot; 分钟&quot;;
    root.querySelector(&quot;#a-budget-bar&quot;).style.width = (total/maximum*100) + &quot;%&quot;;
    root.querySelector(&quot;#a-forecast&quot;).style.width = (464/maximum*100) + &quot;%&quot;;
    root.querySelector(&quot;#a-forecast&quot;).style.background = total &lt; 464 ? &quot;var(--a-alert)&quot; : &quot;var(--a-accent)&quot;;
    root.querySelector(&quot;#a-verdict&quot;).textContent = total &lt; 464 ? &quot;预计超出预算 &quot; + (464-total) + &quot; 分钟&quot; : total === 464 ? &quot;预计负担与预算持平&quot; : &quot;预计负担低于预算 &quot; + (total-464) + &quot; 分钟&quot;;
    root.querySelector(&quot;#a-allowance&quot;).textContent = total &lt; 464 ? &quot;新增建议：暂停新增&quot; : &quot;新增额度：需进一步模拟&quot;;
    root.querySelector(&quot;#a-bars&quot;).setAttribute(&quot;aria-label&quot;, &quot;预计复习464分钟，预算&quot;+total+&quot;分钟&quot;);
  }
  input.addEventListener(&quot;change&quot;,renderBudget);
  renderBudget();
  const design = { compact:false };
  if (globalThis.Tweak) {
    const tweak = new Tweak({container:root,onChange:()=&gt;root.style.setProperty(&quot;--a-row-space&quot;,design.compact ? &quot;10px&quot; : &quot;17px&quot;)});
    tweak.addToggle(design,&quot;compact&quot;,{label:&quot;紧凑卡片列表&quot;});
  }
})();
&lt;/script&gt;
