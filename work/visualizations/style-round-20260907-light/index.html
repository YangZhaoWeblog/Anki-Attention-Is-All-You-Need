<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Attention · 棱光白相近配色</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f0f0f2;color:#202026;font:14px/1.5 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}button,a{-webkit-tap-highlight-color:transparent}button{font:inherit;cursor:pointer;border:1px solid #dcdce2;background:#fff;color:inherit;border-radius:12px;padding:10px 16px}button:hover{border-color:#80788d}button:focus-visible,a:focus-visible{outline:3px solid #936ce2;outline-offset:3px}header{min-height:82px;display:flex;align-items:center;justify-content:space-between;gap:20px;padding:14px 28px;background:#fff;border-bottom:1px solid #e2e2e7}h1{font-size:16px;margin:0;font-weight:650}header p{margin:3px 0 0;color:#797980;font-size:12px}.options{display:flex;gap:8px}.options button[aria-pressed="true"]{background:#25212d;color:#fff;border-color:#25212d}.stage{height:calc(100dvh - 156px);overflow:auto;display:flex;justify-content:center;align-items:flex-start;padding:18px 24px}.stage img{display:block;max-height:100%;max-width:100%;width:auto;height:auto;box-shadow:0 10px 40px #25212d16;border-radius:8px;cursor:zoom-in}.stage.zoom img{max-height:none;width:min(1100px,100%);flex-shrink:0;cursor:zoom-out}footer{height:74px;padding:12px 28px;background:#fff;border-top:1px solid #e2e2e7;display:flex;align-items:center;justify-content:space-between;gap:16px}.caption{display:flex;align-items:baseline;gap:14px}.caption strong{font-size:16px}.caption span{color:#71717c;font-size:12px}.actions{display:flex;align-items:center;gap:10px}.actions a{font-size:12px;color:#62566e;text-underline-offset:3px}.count{font-variant-numeric:tabular-nums;color:#797980;min-width:38px;text-align:center}.error{margin:30px;color:#964537}.hidden{display:none}@media(max-width:760px){header{padding:12px 16px;flex-direction:column;gap:10px;align-items:flex-start;min-height:128px}.options{width:100%}.options button{flex:1;padding:9px 8px;font-size:12px}.stage{height:calc(100dvh - 234px);padding:12px}.caption{display:block}.caption span{display:block}footer{height:106px;padding:10px 16px;gap:8px;flex-wrap:wrap}.actions{margin-left:auto}.actions button{padding:8px 12px}.caption strong{font-size:14px}}
.stage.zoom{display:block}.stage.zoom img{width:1100px;max-width:none;margin:0 auto}.stage img.hidden{display:none}
</style>
<header><div><h1>Attention · 棱光白相近配色</h1><p>原版与两种相近配色。概念效果图，文字与数据以正式产品为准。</p></div><nav class="options" aria-label="选择视觉方案"><button data-index="0" aria-pressed="true">A · 棱光白原版</button><button data-index="1" aria-pressed="false">B · 珍珠虹彩</button><button data-index="2" aria-pressed="false">C · 雾粉瓷白</button></nav></header>
<main class="stage" aria-label="方案预览"><img id="preview" src="option-a.png" alt="A 棱光白：柔和紫色棱光与白色卡片"><p class="error hidden" role="alert">图片未能加载，请保留本页与三张图片在同一文件夹。</p></main>
<footer><div class="caption" aria-live="polite"><strong id="name">A · 棱光白原版</strong><span id="description">柔和棱光 · 通透白底 · 紫色焦点</span></div><div class="actions"><a id="original" href="option-a.png" target="_blank" rel="noopener">原图</a><button id="zoom" aria-pressed="false">放大细看</button><button id="previous" aria-label="上一套方案">←</button><span class="count" id="count">1 / 3</span><button id="next" aria-label="下一套方案">→</button></div></footer>
<script>
const variants=[{name:'A · 棱光白原版',description:'柔和棱光 · 通透白底 · 紫色焦点',image:'option-a.png'},{name:'B · 珍珠虹彩',description:'珍珠白底 · 冷调虹彩 · 轻盈光感',image:'option-b.png'},{name:'C · 雾粉瓷白',description:'明亮瓷白 · 雾粉暖光 · 柔和层次',image:'option-c.png'}];
let current=0;
const preview=document.querySelector('#preview'),stage=document.querySelector('.stage'),error=document.querySelector('.error'),zoom=document.querySelector('#zoom');
function show(index){current=(index+variants.length)%variants.length;const variant=variants[current];error.classList.add('hidden');preview.classList.remove('hidden');preview.src=variant.image;preview.alt=variant.name+'：'+variant.description;document.querySelector('#name').textContent=variant.name;document.querySelector('#description').textContent=variant.description;document.querySelector('#count').textContent=(current+1)+' / '+variants.length;document.querySelector('#original').href=variant.image;document.querySelectorAll('[data-index]').forEach((button,i)=>button.setAttribute('aria-pressed',String(i===current)));}
function toggleZoom(){const enlarged=stage.classList.toggle('zoom');zoom.setAttribute('aria-pressed',String(enlarged));zoom.textContent=enlarged?'查看整页':'放大细看';stage.scrollTop=0;}
document.querySelectorAll('[data-index]').forEach(button=>button.addEventListener('click',()=>show(Number(button.dataset.index))));
document.querySelector('#previous').addEventListener('click',()=>show(current-1));
document.querySelector('#next').addEventListener('click',()=>show(current+1));
zoom.addEventListener('click',toggleZoom);preview.addEventListener('click',toggleZoom);
preview.addEventListener('error',()=>{error.classList.remove('hidden');preview.classList.add('hidden');});
document.addEventListener('keydown',event=>{if(event.altKey||event.ctrlKey||event.metaKey||event.shiftKey)return;if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();show(current+(event.key==='ArrowRight'?1:-1));}else if(['1','2','3'].includes(event.key)){show(Number(event.key)-1);}});
</script>
</html>
